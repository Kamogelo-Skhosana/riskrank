name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (black)
        run: black --check src tests

      - name: Run tests (pytest)
        env:
          # CI runs with mocked LLM/ZAP clients — no live API keys needed.
          RISKRANK_ENV: "ci"
        run: pytest --cov=src/riskrank --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  docker:
    # Builds the image and smoke-tests it (R046): the CLI runs, the dashboard
    # answers /health, and docker-compose.yml is valid.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t riskrank:ci .

      - name: CLI runs in the container
        run: docker run --rm riskrank:ci --help

      - name: Dashboard answers /health
        run: |
          docker run -d --name riskrank-dashboard -p 127.0.0.1:8000:8000 riskrank:ci serve
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs riskrank-dashboard
          exit 1

      - name: Compose file is valid
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose --profile demo --profile cli config --services

# Local git hooks — run automatically on `git commit` (R003).
# Setup (once per clone):  pip install -r requirements-dev.txt && pre-commit install
# Run on everything:       pre-commit run --all-files
#
# Hook versions are pinned to match requirements-dev.txt so local hooks and CI
# enforce exactly the same rules. Bump both together.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(src|tests)/

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black
        files: ^(src|tests)/

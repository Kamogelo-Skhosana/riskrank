[project]
name = "riskrank"
version = "0.1.0"
description = "AI-powered vulnerability scanner and prioritizer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
riskrank = "riskrank.cli:app"

[tool.setuptools.package-data]
# Ship the Jinja2 templates with the package (R029 report, R039+ dashboard).
riskrank = ["report/templates/*.j2", "dashboard/templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
